<svg width="340" height="88" viewBox="0 0 340 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="salesBadgeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="badgeGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo in front -->
  <image href="data:image/png;base64," x="6" y="6" width="76" height="76" />

  <!-- Brand Name: whatnot -->
  <text x="94" y="56" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#0f172a" letter-spacing="-0.035em">whatnot</text>

  <!-- SALES Accent Badge -->
  <g transform="translate(258, 30)">
    <rect x="0" y="0" width="68" height="28" rx="7" fill="url(#salesBadgeLight)" filter="url(#badgeGlowLight)" />
    <text x="34" y="19" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="0.14em" text-anchor="middle">SALES</text>
  </g>
</svg>